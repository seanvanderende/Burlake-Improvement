kind = "mobile"
previewPath = "/burlake-mobile/"
title = "Burnaby Lake — Buyer Portal"
version = "1.0.0"
id = "artifacts/burlake-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/burlake-mobile/" ]
localPort = 26090

[services.development]
run = "pnpm --filter @workspace/burlake-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/burlake-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/burlake-mobile", "run", "serve" ]

[services.env]
PORT = "26090"
BASE_PATH = "/burlake-mobile/"
