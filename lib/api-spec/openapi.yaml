openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: products
    description: Product catalog operations
  - name: collections
    description: Collection management operations
  - name: admin
    description: Admin authentication operations
  - name: storage
    description: Object storage operations
  - name: brochures
    description: Seasonal brochure operations
  - name: priceLists
    description: Wholesale price list operations
  - name: applications
    description: Wholesale account application operations
  - name: orderForms
    description: Order form operations
  - name: analytics
    description: Site traffic analytics operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /collections:
    get:
      operationId: listCollections
      tags: [collections]
      summary: List collections
      description: Returns all collections sorted by sortOrder then name, with product counts
      parameters:
        - name: availableOnly
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of collections
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Collection"

  /admin/collections:
    post:
      operationId: createCollection
      tags: [collections]
      summary: Create a collection
      description: Creates a new collection (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/collections/{id}:
    patch:
      operationId: updateCollection
      tags: [collections]
      summary: Update a collection
      description: Updates a collection's name, slug, or sort order (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollectionUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Collection"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteCollection
      tags: [collections]
      summary: Delete a collection
      description: Deletes a collection and all its product links (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /analytics/pageview:
    post:
      operationId: recordPageView
      tags: [analytics]
      summary: Record a page view
      description: Logs a single page view for site traffic analytics
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageViewInput"
      responses:
        "204":
          description: Recorded

  /admin/analytics/summary:
    get:
      operationId: getAnalyticsSummary
      tags: [analytics]
      summary: Get site traffic summary
      description: Returns daily/weekly/monthly visit counts and the most visited pages (admin only)
      responses:
        "200":
          description: Traffic summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/sizes:
    get:
      operationId: listProductSizes
      tags: [products]
      summary: List distinct product sizes
      description: Returns all distinct non-null size strings from products
      responses:
        "200":
          description: Array of size strings
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /products:
    get:
      operationId: listProducts
      tags: [products]
      summary: List products
      description: Returns all products, optionally filtered by collection or availability
      parameters:
        - name: collectionId
          in: query
          required: false
          schema:
            type: integer
        - name: size
          in: query
          required: false
          description: Filter by exact size value
          schema:
            type: string
        - name: availableOnly
          in: query
          required: false
          schema:
            type: boolean
      responses:
        "200":
          description: List of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product
      description: Creates a new product (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /products/{id}:
    get:
      operationId: getProduct
      tags: [products]
      summary: Get a product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product
      description: Updates a product (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProduct
      tags: [products]
      summary: Delete a product
      description: Deletes a product (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/products/bulk:
    post:
      operationId: bulkCreateProducts
      tags: [products]
      summary: Bulk create products
      description: Creates multiple products in a single request (admin only). Collections are matched by name and created automatically if they do not exist. Returns counts of created and failed rows.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkCreateProductsInput"
      responses:
        "200":
          description: Bulk import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkCreateProductsResult"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/products/bulk-delete:
    post:
      operationId: bulkDeleteProducts
      tags: [products]
      summary: Bulk delete products
      description: Deletes multiple products by ID (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkDeleteProductsInput"
      responses:
        "200":
          description: Bulk delete result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkDeleteProductsResult"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/login:
    post:
      operationId: adminLogin
      tags: [admin]
      summary: Admin login
      description: Logs in with the shared admin password, starting a session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"
        "401":
          description: Invalid password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/logout:
    post:
      operationId: adminLogout
      tags: [admin]
      summary: Admin logout
      description: Ends the current admin session
      responses:
        "204":
          description: Logged out

  /admin/session:
    get:
      operationId: getAdminSession
      tags: [admin]
      summary: Get current admin session status
      responses:
        "200":
          description: Session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSession"

  /brochures/auth:
    post:
      operationId: brochureAuth
      tags: [brochures]
      summary: Authenticate as a wholesale buyer to access brochures
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrochureAuthInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrochureSession"
        "401":
          description: Incorrect password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    get:
      operationId: getBrochureSession
      tags: [brochures]
      summary: Check whether the current session has brochure access
      responses:
        "200":
          description: Session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrochureSession"

  /brochures:
    get:
      operationId: listBrochures
      tags: [brochures]
      summary: List all brochures (requires brochure or admin session)
      responses:
        "200":
          description: List of brochures
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Brochure"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /brochures/{id}/download:
    get:
      operationId: downloadBrochure
      tags: [brochures]
      summary: Stream a brochure PDF (requires portal or admin session)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PDF file stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/brochures:
    post:
      operationId: createBrochure
      tags: [brochures]
      summary: Register a brochure record after client-side upload (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BrochureInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Brochure"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/brochures/{id}:
    delete:
      operationId: deleteBrochure
      tags: [brochures]
      summary: Delete a brochure record (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /price-lists:
    get:
      operationId: listPriceLists
      tags: [priceLists]
      summary: List all price lists (requires portal or admin session)
      responses:
        "200":
          description: List of price lists
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PriceList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /price-lists/{id}/download:
    get:
      operationId: downloadPriceList
      tags: [priceLists]
      summary: Stream a price list PDF (requires portal or admin session)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: PDF file stream
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/price-lists:
    post:
      operationId: createPriceList
      tags: [priceLists]
      summary: Register a price list record after client-side upload (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PriceListInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PriceList"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/price-lists/{id}:
    delete:
      operationId: deletePriceList
      tags: [priceLists]
      summary: Delete a price list record (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /applications:
    post:
      operationId: submitApplication
      tags: [applications]
      summary: Submit a wholesale account application
      description: Public endpoint for new buyers to submit a wholesale account application
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List all wholesale applications
      description: Returns all applications sorted by newest first (admin only)
      responses:
        "200":
          description: List of applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /admin/applications/{id}:
    patch:
      operationId: updateApplication
      tags: [applications]
      summary: Update an application status
      description: Updates application status (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationUpdate"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /order-forms:
    get:
      operationId: listOrderForms
      tags: [orderForms]
      summary: List active order forms (portal access required)
      responses:
        "200":
          description: List of active order forms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrderForm"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /order-forms/{id}:
    get:
      operationId: getOrderForm
      tags: [orderForms]
      summary: Get a single order form with its items (portal access required)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Order form with items
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderFormWithItems"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a presigned upload URL
      description: Returns a presigned URL for uploading a product image directly to storage (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadRequestInput"
      responses:
        "200":
          description: Presigned upload info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PresignedUpload"
        "401":
          description: Not authenticated as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ProductCollection:
      type: object
      description: A slim collection reference embedded in product responses
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string

    Collection:
      type: object
      required:
        - id
        - name
        - slug
        - sortOrder
        - productCount
        - availableCount
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        grp:
          type: string
          nullable: true
          description: "Filter-panel section: 'category' | 'collection' | 'holiday' | null"
        sortOrder:
          type: integer
        productCount:
          type: integer
        availableCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CollectionInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
        grp:
          type: string
          nullable: true
        sortOrder:
          type: integer

    CollectionUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        slug:
          type: string
        grp:
          type: string
          nullable: true
        sortOrder:
          type: integer

    Product:
      type: object
      required:
        - id
        - name
        - collections
        - imageUrl
        - photos
        - sku
        - size
        - description
        - available
        - sortOrder
        - createdAt
        - updatedAt
      properties:
        id:
          type: integer
        name:
          type: string
        collections:
          type: array
          items:
            $ref: "#/components/schemas/ProductCollection"
        imageUrl:
          type: ["string", "null"]
        photos:
          type: array
          description: Additional photos beyond the primary imageUrl, in display order.
          items:
            type: string
        sku:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        available:
          type: boolean
        sortOrder:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ProductInput:
      type: object
      required:
        - name
        - collectionIds
      properties:
        name:
          type: string
          minLength: 1
        collectionIds:
          type: array
          items:
            type: integer
          minItems: 1
        imageUrl:
          type: ["string", "null"]
        photoUrls:
          type: array
          description: Additional photos beyond the primary imageUrl, in display order. Omit to leave unchanged; pass an array (including empty) to replace.
          items:
            type: string
        sku:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        available:
          type: boolean
        sortOrder:
          type: integer

    ProductUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        collectionIds:
          type: array
          items:
            type: integer
          minItems: 1
        imageUrl:
          type: ["string", "null"]
        photoUrls:
          type: array
          description: Additional photos beyond the primary imageUrl, in display order. Omit to leave unchanged; pass an array (including empty) to replace.
          items:
            type: string
        sku:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        available:
          type: boolean
        sortOrder:
          type: integer

    BulkProductInput:
      type: object
      description: A single product row for bulk import. Collections are matched by name and auto-created if new.
      required:
        - name
        - collectionNames
      properties:
        name:
          type: string
          minLength: 1
        collectionNames:
          type: array
          items:
            type: string
          minItems: 1
        imageUrl:
          type: ["string", "null"]
        sku:
          type: ["string", "null"]
        size:
          type: ["string", "null"]
        description:
          type: ["string", "null"]
        available:
          type: boolean
        sortOrder:
          type: integer

    BulkCreateProductsInput:
      type: object
      required:
        - products
      properties:
        products:
          type: array
          items:
            $ref: "#/components/schemas/BulkProductInput"
          maxItems: 2000

    BulkCreateProductsResult:
      type: object
      required:
        - created
        - duplicates
        - failed
      properties:
        created:
          type: integer
        duplicates:
          type: integer
        failed:
          type: integer
        errors:
          type: array
          items:
            type: string

    BulkDeleteProductsInput:
      type: object
      required:
        - ids
      properties:
        ids:
          type: array
          items:
